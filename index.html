<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Northwest Fur Trade Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Fur Trade Simulator: 1820</h1>
        
        <div class="inventory">
            <h3>Your Inventory</h3>
            <p>Beaver Pelts: <span id="pelts">10</span></p>
            <p>Pemmican: <span id="pemmican">5</span></p>
            <p>Metal Tools: <span id="tools">0</span></p>
        </div>

        <div class="market">
            <h3>The Trading Post</h3>
            <div class="trade-option">
                <p>1 Beaver Pelt → 2 Metal Tools</p>
                <button onclick="trade('peltToTools')">Trade Pelt</button>
            </div>
            <div class="trade-option">
                <p>2 Pemmican → 1 Beaver Pelt</p>
                <button onclick="trade('pemmicanToPelt')">Trade Pemmican</button>
            </div>
        </div>

        <div id="status-log">Welcome to the Red River Colony. Start your trade.</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
