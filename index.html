<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fur Trade Game</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<h1>Fur Trade Game</h1>
<div id="game">
  <div id="status"></div>
  <div class="offers">
    <div>
      <h2>European's Offer</h2>
      <p id="european-offer"></p>
    </div>
    <div>
      <h2>Métis's Offer</h2>
      <p id="metis-offer"></p>
    </div>
  </div>
  <button id="tradeBtn">Make Trade</button>
  <div id="result"></div>
  <button id="restartBtn" style="display:none;">Restart Game</button>
</div>
<script src="script.js"></script>
</body>
</html>
