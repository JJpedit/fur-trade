<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fur Trade Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Fur Trade Simulator</h1>

<h2 id="valueDisplay"></h2>

<div class="container">

  <!-- PLAYER SIDE -->
  <div class="box">
    <h2>Your Inventory</h2>
    <div id="playerInv"></div>

    <h3>Your Trade Offer</h3>
    <div id="playerOffer"></div>

    <button onclick="hunt()">Hunt</button>
  </div>

  <!-- CENTER CONTROL -->
  <div class="box">
    <h2>Trade Controls</h2>

    <button onclick="attemptTrade()">Offer Trade</button>
    <button onclick="resetTrade()">Reset Trade</button>

    <p id="result"></p>
  </div>

  <!-- TRADER SIDE -->
  <div class="box">
    <h2>Trader Inventory</h2>
    <div id="traderInv"></div>

    <h3>Trader Offer</h3>
    <div id="traderOffer"></div>
  </div>

</div>

<!-- IMPORTANT: JS LINK -->
<script src="script.js"></script>

</body>
</html>
