<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jaittrans Cookies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🍪 Jaittrans Cookies</h1>
    <p>Fresh. Sweet. Elite.</p>
  </header>

  <section class="menu">
    <h2>Our Flavours</h2>
    <div class="cookies">
      <div class="cookie">
        <h3>Nutella</h3>
        <p>Rich chocolate + Nutella goodness</p>
      </div>
      <div class="cookie">
        <h3>Choco Chunk</h3>
        <p>Classic chunky chocolate cookies</p>
      </div>
      <div class="cookie">
        <h3>Cookies & Cream</h3>
        <p>Oreo-style creamy flavor</p>
      </div>
    </div>
  </section>

  <section class="order">
    <h2>Order Now</h2>
    <form id="orderForm">
      <input type="text" placeholder="Your Name" required>

      <select required>
        <option value="">Select Flavor</option>
        <option>Nutella</option>
        <option>Choco Chunk</option>
        <option>Cookies & Cream</option>
      </select>

      <input type="number" placeholder="Quantity" min="1" required>

      <button type="submit">Place Order</button>
    </form>

    <p id="confirmation"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
