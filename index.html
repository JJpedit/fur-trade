<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fur Trade Open World</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="hud">
  <h2>Fur Trade World</h2>
  <p id="ui">Loading...</p>
  <p id="info"></p>

  <p class="controls">
    WASD = Move | SPACE = Hunt | E = Trade
  </p>
</div>

<canvas id="game" width="900" height="500"></canvas>

<!-- TRADE POPUP -->
<div id="tradeUI">
  <h3 id="tradeTitle"></h3>
  <p>Press ACCEPT to sell items</p>

  <button onclick="acceptTrade()">Accept Trade</button>
  <button onclick="exitTrade()">Leave</button>
</div>

<script src="script.js"></script>

</body>
</html>
