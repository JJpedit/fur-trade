<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyageur: The Red River Trade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <header>
            <h1>VOYAGEUR</h1>
            <p id="date-display">Year: 1822 | Season: Autumn</p>
        </header>

        <main>
            <section class="stats-bar">
                <div class="stat">🪙 MB: <span id="currency">10</span></div>
                <div class="stat">🥩 Food: <span id="food">20</span></div>
                <div class="stat">🛶 Health: <span id="health">100</span>%</div>
            </section>

            <div class="game-grid">
                <aside class="inventory-panel">
                    <h3>Cargo</h3>
                    <ul id="inventory-list">
                        </ul>
                </aside>

                <section class="action-panel">
                    <div class="location-visual">
                        <div id="location-name">Fort Garry</div>
                        <img id="scene-img" src="https://via.placeholder.com/400x200?text=Trading+Post" alt="Historical Scene">
                    </div>
                    
                    <div class="button-group">
                        <button onclick="game.trade('beaver')">Trade Beaver Pelts</button>
                        <button onclick="game.trade('pemmican')">Supply Pemmican</button>
                        <button onclick="game.hunt()">Go Bison Hunt</button>
                        <button onclick="game.nextTurn()">End Month</button>
                    </div>
                </section>
            </div>

            <footer class="event-log">
                <h3>Journal</h3>
                <div id="log-content">You arrived at the Red River Colony. The Métis families are preparing for the winter.</div>
            </footer>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
