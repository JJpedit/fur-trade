<!DOCTYPE html>
<html>
<head>
  <title>Fur Trade Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Fur Trade</h1>

<h2 id="valueDisplay"></h2>

<div class="container">

  <!-- PLAYER INVENTORY -->
  <div class="box">
    <h2>Your Inventory</h2>
    <div id="playerInv"></div>

    <h3>Your Offer</h3>
    <div id="playerOffer"></div>
  </div>

  <!-- TRADE AREA -->
  <div class="box">
    <h2>Trade</h2>

    <button onclick="attemptTrade()">Accept Trade</button>
    <button onclick="resetTrade()">Reset Trade</button>

    <p id="result"></p>
  </div>

  <!-- TRADER INVENTORY -->
  <div class="box">
    <h2>Trader Inventory</h2>
    <div id="traderInv"></div>

    <h3>Trader Offer</h3>
    <div id="traderOffer"></div>
  </div>

</div>

<!-- JS LINK -->
<script src="script.js"></script>

</body>
</html>
